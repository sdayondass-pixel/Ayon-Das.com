
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার সোনামণি ❤️</title>

    <style>
        body {
            background-color: #ffe6f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            color: #c2185b;
        }

        .message-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
            line-height: 2;
        }

        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        #message {
            display: none;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <div class="message-box">

        <h2>❤️🌸 আমার সোনামণি 🌸❤️</h2>

        <button onclick="showMessage()">
            তোমার জন্য একটি মেসেজ 🥰
        </button>

        <p id="message"></p>

        <p>🕒 বর্তমান সময়: <span id="clock"></span></p>

    </div>

    <script>
        function showMessage() {
            const message = document.getElementById("message");

            message.innerHTML =
                `জানো সোনামণি, তুমি আমার জীবনের সেই মানুষ,
যার একটু হাসি আমার মন ভালো করে দেয়,
যার একটু অভিমান আমাকে অস্থির করে তোলে। 🥹❤️

তুমি শুধু আমার ভালোবাসা নও,
তুমি আমার শান্তি, আমার সুখ,
আমার ছোট্ট একটা পৃথিবী। 🌍💖

তোমার সঙ্গে হাজারটা গল্প করতে চাই,
তোমার সঙ্গে ছোট ছোট মুহূর্তগুলো সুন্দর করে কাটাতে চাই। 🫶🥰

জীবনে যত ঝড়ই আসুক না কেন,
তোমার মুখের হাসিটা যেন সবসময় দেখতে পাই।
তোমার হাতটা ধরে অনেক দূর হাঁটতে চাই,
যেখানে থাকবে শুধু আমাদের ভালোবাসা
আর একসঙ্গে থাকার স্বপ্ন। 💞🌷

তুমি আমার কাছে কতটা স্পেশাল,
সেটা হয়তো হাজারটা কথায়ও বোঝাতে পারব না।
তোমার হাসিতে আমার আনন্দ,
তোমার সুখে আমার সুখ।

তুমি সবসময় ভালো থেকো, আমার সোনামণি।
তোমার জীবনের প্রতিটা দিন সুন্দর হোক।
ভগবান তোমাকে সবসময় সুস্থ রাখুন। 🥺💗

আমার লক্ষ্মী সোনামণি,
আমি তোমাকে অনেক অনেক ভালোবাসি। ❤️😘`;

            message.style.display = "block";
        }

        function updateClock() {
            const now = new Date();

            document.getElementById("clock").innerHTML =
                now.toLocaleTimeString("bn-BD");
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
