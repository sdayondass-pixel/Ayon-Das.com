
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi Kobita</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#a18cd1,#fbc2eb);
    background-size:400% 400%;
    animation:bgAnimation 10s ease infinite;
    color:#fff;
    text-align:center;
    padding:20px;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    max-width:900px;
    margin:auto;
    background:rgba(0,0,0,0.5);
    padding:20px;
    border-radius:15px;
    animation:fadeIn 2s;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    color:#ffeb3b;
    margin-bottom:15px;
}

.quote{
    font-size:20px;
    margin:20px 0;
    font-style:italic;
}

img{
    width:100%;
    max-width:600px;
    border-radius:15px;
    margin:15px auto;
    display:block;
    transition:0.5s;
}

img:hover{
    transform:scale(1.05);
}

a{
    color:#00ffff;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    color:#ffeb3b;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#ff4081;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#e91e63;
}

#clock{
    font-size:24px;
    margin:15px 0;
    color:#00ff99;
}

iframe{
    width:100%;
    max-width:700px;
    height:400px;
    margin-top:20px;
    border-radius:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌸 Hi Kobita 🌸</h1>

<div id="clock"></div>

<p class="quote">
"Prionti, your smile makes even ordinary days feel special."
</p>

<p>
Having a friend like you is truly a little piece of happiness in life.
</p>

<br>

<a href="https://www.facebook.com/" target="_blank">
Facebook Profile
</a>

<br><br>

<img src="https://img.freepik.com/premium-photo/anime-girl-warrior-wallpaper_776894-108240.jpg?w=740"
alt="Anime Girl">

<button onclick="showMessage()">
Click Here 💖
</button>

<p id="message"></p>

<br>

<iframe
src="https://www.youtube.com/embed/BSJa1UytM8w"
allowfullscreen>
</iframe>

</div>

<script>
function showMessage(){
    document.getElementById("message").innerHTML =
    "✨ Have a wonderful day, Kobita! ✨";
}

function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerHTML =
    now.toLocaleTimeString();
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
